sources:
  - Scoutie-Sans.glyphs
  - Scoutie-Sans-Italic.glyphs
axisOrder:
   - wght
   - ital
familyName: "Scoutie Sans"

cleanUp: true

# Static TTFs are autohinted and webfonts are made by the Makefile after
# scripts/fix_fonts.py runs, so ttfautohint options can be set (TTFA_ARGS) and
# the webfonts include the post-build fixes.
autohintTTF: false
buildWebfont: false

stat:
  Scoutie-Sans[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Book
      value: 350
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
  - name: Italic
    tag: ital
    values:
    - name: Roman
      value: 0
      linkedValue: 1
      flags: 2
  Scoutie-Sans-Italic[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Book
      value: 350
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
  - name: Italic
    tag: ital
    values:
    - name: Italic
      value: 1
      